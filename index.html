<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="description" content="中学英語の単語・熟語をUnitとPartごとに楽しく暗記できる学習サイトです（中1・中2対応）。">
<title>中学英語単語暗記サイト</title>
<style>
:root{
--primary:#2563eb;
--primary-light:#dbeafe;
--bg:#f5f7fb;
--panel:#fff;
--text:#263238;
--muted:#64748b;
--border:#dbe1ea;
--green:#22c55e;
--red:#ef4444;
--yellow:#f59e0b;
--purple:#8b5cf6;
--pink:#ec4899;
--shadow:0 5px 18px rgba(15,23,42,.08);
}
@media(prefers-color-scheme:dark){
:root{
--bg:#111827;
--panel:#1f2937;
--text:#f1f5f9;
--muted:#94a3b8;
--border:#374151;
--primary-light:#1e3a5f;
}
}
*{box-sizing:border-box}
body{
margin:0;
padding:12px;
font-family:"Helvetica Neue",Arial,sans-serif;
background:var(--bg);
color:var(--text);
}
.container{
max-width:1200px;
margin:auto;
background:var(--panel);
border:4px solid var(--primary);
border-radius:14px;
padding:18px;
box-shadow:var(--shadow);
}
h1{
text-align:center;
color:var(--primary);
font-size:25px;
margin:4px 0 6px;
}
.subtitle{
text-align:center;
color:var(--muted);
font-size:13px;
margin-bottom:5px;
}
.note{
text-align:center;
font-size:10px;
color:#94a3b8;
margin-bottom:16px;
}
.important-info{
background:#fff7d6;
border:1px solid #f5d76e;
border-radius:10px;
padding:10px 14px;
font-size:13px;
margin-bottom:15px;
color:#735c00;
}
@media(prefers-color-scheme:dark){
.important-info{background:#3a3218;color:#f8e58b;border-color:#806d23}
}
.unit-tabs{
display:flex;
flex-wrap:wrap;
gap:7px;
margin-bottom:12px;
}
.unit-tab{
border:0;
padding:8px 11px;
border-radius:10px;
font-weight:bold;
cursor:pointer;
color:#fff;
background:#64748b;
transition:.2s;
box-shadow:0 2px 5px rgba(0,0,0,.08);
}
.unit-tab:hover{transform:translateY(-1px)}
.unit-tab.active{
outline:3px solid rgba(37,99,235,.2);
transform:translateY(-1px);
}
.part-tabs{
display:flex;
flex-wrap:wrap;
gap:7px;
margin-bottom:15px;
padding:10px;
background:var(--bg);
border-radius:10px;
}
.part-tab{
padding:7px 12px;
border:2px solid var(--border);
background:var(--panel);
color:var(--text);
border-radius:8px;
font-weight:bold;
cursor:pointer;
}
.part-tab.active{
background:var(--primary);
color:#fff;
border-color:var(--primary);
}
.mode-select,.settings-select{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:8px;
margin-bottom:15px;
}
.mode-btn,.setting-btn{
padding:9px 13px;
font-size:13px;
background:var(--panel);
color:var(--text);
cursor:pointer;
border-radius:7px;
font-weight:bold;
border:2px solid #64748b;
}
.mode-btn{border-color:var(--primary);color:var(--primary)}
.mode-btn.active{background:var(--primary);color:#fff}
.setting-btn.active{background:#64748b;color:#fff}
.filter-row{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:8px;
margin-bottom:15px;
}
.filter-btn{
border:2px solid var(--yellow);
background:var(--panel);
color:var(--text);
border-radius:20px;
padding:7px 13px;
font-weight:bold;
cursor:pointer;
}
.filter-btn.active{
background:var(--yellow);
color:#fff;
}
#timer-container{
width:100%;
height:9px;
background:#e5e7eb;
border-radius:10px;
overflow:hidden;
display:none;
margin-bottom:14px;
}
#timer-bar{
height:100%;
width:100%;
background:#22c55e;
transition:width .1s linear;
}
#combo-display{
display:none;
font-size:18px;
font-weight:bold;
color:#ef4444;
margin-bottom:10px;
text-align:center;
}
.table-container{
width:100%;
overflow-x:auto;
-webkit-overflow-scrolling:touch;
}
table{
width:100%;
border-collapse:collapse;
margin:10px 0 18px;
min-width:850px;
}
th,td{
border:1px solid var(--border);
padding:9px 5px;
text-align:center;
font-size:13px;
}
th{
background:#eef2f7;
}
@media(prefers-color-scheme:dark){
th{background:#273244}
}
.col-word{background:#e8f1ff!important}
.col-past{background:#e8f8ed!important}
.col-ppart{background:#f3e8ff!important}
.col-ing{background:#fff0e4!important}
.unit-cell{
font-weight:bold;
color:#fff;
border-radius:5px;
padding:4px 7px;
display:inline-block;
font-size:11px;
}
.word-main{
font-size:14px;
font-weight:600;
}
.word-main.important{
font-weight:900;
}
.important-star{
color:#eab308;
font-size:11px;
margin-left:3px;
}
.multi-word{
display:inline-block;
line-height:1.35;
}
.multi-word .word-token{
display:inline-block;
padding:1px 3px;
}
.expression-badge{
display:inline-block;
font-size:10px;
background:#ede9fe;
color:#6d28d9;
border-radius:5px;
padding:2px 5px;
margin-top:3px;
}
.short-badge{
display:block;
font-size:10px;
color:#64748b;
margin-top:3px;
}
.fav-btn{
border:0;
background:none;
font-size:19px;
cursor:pointer;
color:#cbd5e1;
}
.fav-btn.active{color:#f59e0b}
.fav-btn.pop{animation:pop .35s}
@keyframes pop{
30%{transform:scale(1.5)}
60%{transform:scale(.8)}
100%{transform:scale(1)}
}
.tape-container{
position:relative;
display:inline-flex;
align-items:center;
justify-content:center;
gap:3px;
width:95%;
min-height:32px;
}
.tape-text{
font-weight:bold;
font-size:12px;
}
.tape{
position:absolute;
inset:0;
background:#1f2937;
border-radius:4px;
cursor:pointer;
transition:.15s;
}
.tape.reveal{
opacity:0;
pointer-events:none;
}
.tts-btn,.hint-btn{
border:0;
background:none;
cursor:pointer;
font-size:12px;
padding:2px;
}
.quiz-input{
width:95%;
padding:7px 5px;
border:1px solid var(--border);
border-radius:5px;
text-align:center;
background:var(--panel);
color:var(--text);
}
.quiz-input.correct{
background:#d1fae5!important;
border-color:#86efac;
color:#166534;
font-weight:bold;
}
.quiz-input.incorrect{
background:#fee2e2!important;
border-color:#fca5a5;
color:#991b1b;
font-weight:bold;
}
.spell-error-hint{
display:block;
font-size:10px;
color:#dc2626;
font-weight:bold;
margin-top:3px;
}
.action-btns{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:10px;
margin:20px 0;
}
.action-btn{
padding:12px 24px;
border:0;
border-radius:25px;
color:#fff;
font-weight:bold;
cursor:pointer;
box-shadow:0 4px 10px rgba(0,0,0,.12);
}
.submit-btn{background:linear-gradient(135deg,#22c55e,#10b981)}
.reset-btn{background:linear-gradient(135deg,#64748b,#475569)}
.review-btn{background:linear-gradient(135deg,#f59e0b,#d97706)}
.qa-container{
background:var(--bg);
border:1px solid var(--border);
padding:20px;
border-radius:12px;
margin:15px 0;
text-align:center;
}
.qa-title{font-size:15px;font-weight:bold;margin-bottom:12px}
.qa-question{font-size:18px;font-weight:bold;margin-bottom:18px}
.qa-options{
display:flex;
flex-direction:column;
gap:9px;
max-width:600px;
margin:auto;
}
.qa-opt-btn{
padding:12px;
border:2px solid var(--border);
background:var(--panel);
color:var(--text);
border-radius:25px;
font-weight:bold;
cursor:pointer;
}
.qa-opt-btn.correct{
background:#22c55e!important;
color:#fff!important;
border-color:#22c55e;
}
.qa-opt-btn.incorrect{
background:#ef4444!important;
color:#fff!important;
border-color:#ef4444;
}
.qa-opt-btn.disabled{pointer-events:none;opacity:.65}
.qa-feedback{
margin-top:15px;
padding:12px;
border-radius:9px;
text-align:left;
line-height:1.6;
font-weight:bold;
}
.qa-feedback.correct{background:#d1fae5;color:#166534}
.qa-feedback.incorrect{background:#fee2e2;color:#991b1b}
.qa-next-btn{
margin-top:12px;
padding:11px 25px;
border:0;
border-radius:25px;
background:linear-gradient(135deg,#3b82f6,#1d4ed8);
color:#fff;
font-weight:bold;
cursor:pointer;
}
.section-card{
margin:20px 0;
padding:16px;
border:1px solid var(--border);
border-radius:12px;
background:var(--panel);
}
.section-title{
font-size:18px;
font-weight:900;
margin-bottom:10px;
}
.sticky{
display:inline-block;
padding:7px 14px;
background:#fff3a6;
color:#5f5200;
font-weight:900;
border-radius:2px;
box-shadow:2px 3px 5px rgba(0,0,0,.15);
transform:rotate(-1deg);
margin-bottom:10px;
}
.pronoun-wrap{
overflow-x:auto;
}
.pronoun-table{
min-width:850px;
margin:0;
}
.pronoun-table th{
background:#dbeafe;
}
.pronoun-table .person1{background:#eff6ff}
.pronoun-table .person2{background:#f0fdf4}
.pronoun-table .person3{background:#fff7ed}
.pronoun-table .plural{background:#faf5ff}
.pronoun-note{
font-size:12px;
color:var(--muted);
margin-top:8px;
}
.scroll-top{
position:fixed;
right:20px;
bottom:20px;
width:48px;
height:48px;
border-radius:50%;
border:2px solid var(--border);
background:var(--panel);
color:var(--text);
cursor:pointer;
box-shadow:var(--shadow);
opacity:0;
visibility:hidden;
transition:.2s;
z-index:999;
}
.scroll-top.show{
opacity:1;
visibility:visible;
}
footer{
margin-top:40px;
padding:20px 0;
border-top:1px solid var(--border);
text-align:center;
}
footer a{
display:inline-block;
padding:10px 18px;
border-radius:9px;
text-decoration:none;
background:var(--panel);
border:1px solid var(--border);
color:#64748b;
font-weight:bold;
}
.empty{
padding:30px;
text-align:center;
color:#94a3b8;
}
</style>
</head>
<body>

<div class="container">

<h1>中学英語単語暗記サイト</h1>
<div class="subtitle">東京書籍「NEW HORIZON English Course」対応・中学1・2年生</div>
<div class="note">※ 人名は省く。</div>

<div class="important-info">
<strong>★ 重要単語・お気に入りについて</strong><br>
教科書で特に覚えたい重要語として登録した単語は<strong>太文字</strong>で表示しています。
フィルターで「★重要単語だけ練習」や「⭐お気に入りのみ」を選んで効率よく練習できます！
</div>

<div class="unit-tabs" id="unit-tabs"></div>
<div class="part-tabs" id="part-tabs"></div>

<div class="filter-row">
<button class="filter-btn active" id="filter-all" onclick="changeFilterMode('all')">すべて</button>
<button class="filter-btn" id="filter-important" onclick="changeFilterMode('important')">★重要単語だけ練習</button>
<button class="filter-btn" id="filter-favorite" onclick="changeFilterMode('favorite')">⭐お気に入りのみ</button>
</div>

<div class="mode-select">
<button class="mode-btn active" id="mode-memorize" onclick="switchMode('memorize')">暗記モード</button>
<button class="mode-btn" id="mode-write" onclick="switchMode('write')">記入モード</button>
<button class="mode-btn" id="mode-table" onclick="switchMode('table')">単語一覧</button>
<button class="mode-btn" id="mode-question" onclick="switchMode('question')">問題！</button>
<button class="mode-btn" id="mode-pronoun" onclick="switchMode('pronoun')">代名詞表</button>
</div>

<div id="settings-area" class="settings-select" style="display:none">
<span>⏱ 4択難易度：</span>
<button class="setting-btn" id="set-easy" onclick="changeDifficulty('easy')">イージー（15秒）</button>
<button class="setting-btn active" id="set-normal" onclick="changeDifficulty('normal')">ノーマル（10秒）</button>
<button class="setting-btn" id="set-hard" onclick="changeDifficulty('hard')">ハード（5秒）</button>
</div>

<div id="combo-display">🔥 0 コンボ！</div>

<div id="timer-container">
<div id="timer-bar"></div>
</div>

<div id="normal-table-area" class="table-container">
<table>
<thead>
<tr>
<th>★</th>
<th>Unit / Part</th>
<th>意味</th>
<th class="col-word">現在形・原形</th>
<th class="col-past">過去形</th>
<th class="col-ppart">過去分詞</th>
<th class="col-ing">～ing形</th>
</tr>
</thead>
<tbody id="words-body"></tbody>
</table>
</div>

<div id="pronoun-area" style="display:none"></div>

<div id="question-mode-area" class="qa-container" style="display:none">
<div class="qa-title" id="qa-mode-title"></div>
<div class="qa-question" id="qa-question-text"></div>
<div class="qa-options" id="qa-options-box"></div>
<div id="qa-feedback-box"></div>
</div>

<div class="action-btns">
<button id="submit-btn" class="action-btn submit-btn" style="display:none" onclick="checkAnswers()">答え合わせ</button>
<button id="review-btn" class="action-btn review-btn" style="display:none" onclick="startReviewMode()">間違えた問題を復習</button>
<button id="reset-btn" class="action-btn reset-btn" onclick="resetQuiz()">やり直す</button>
</div>

<footer>
<p><a href="https://winu-u0304.github.io/List-of-Memorization-Websites/" target="_blank" rel="noopener noreferrer">⬅ 暗記サイト表に戻る</a></p>
</footer>

</div>

<button id="scrollTopBtn" class="scroll-top" onclick="window.scrollTo({top:0,behavior:'smooth'})">▲</button>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
<script src="english-word.js"></script>

</body>
</html>
